name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Pinned upstream static release, not the distro package: Ubuntu's
  # dwarfs (if any) lags and differs from Arch/Artix's, and mkdwarfs -l
  # levels / CLI flags are what Publisher depends on. Bump both together;
  # the sha256 is upstream's own published asset digest. Pinned to a
  # release that had been out for weeks, not the newest one.
  DWARFS_VERSION: "0.15.8"
  DWARFS_SHA256: "f5eb34c3e2ac1bfcbe66e15b8a66da20897049b22867d2c193bffedf25cc08ae"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # fuse3 provides fusermount3 (unmount, and the setuid helper the
      # dwarfs driver mounts through); /dev/fuse itself is already present
      # on GitHub's hosted Ubuntu runners.
      - name: Install fuse3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fuse3

      - name: Install pinned dwarfs release
        run: |
          tarball="dwarfs-${DWARFS_VERSION}-Linux-x86_64.tar.xz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/mhx/dwarfs/releases/download/v${DWARFS_VERSION}/$tarball"
          echo "${DWARFS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/dwarfs-${DWARFS_VERSION}-Linux-x86_64/bin" >> "$GITHUB_PATH"

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.17"

      # .pb.ex files are committed, not regenerated here -- protoc-gen-
      # elixir codegen is a manual dev-time step (mix protobuf.generate),
      # not part of the compile/test path.
      - name: Elixir deps
        working-directory: manager
        run: mix deps.get

      # Fails if mix.lock pins a package its maintainers retired (often for
      # security). Built into Hex, so no new dependency and mix.lock is
      # untouched. CVEs in mix.lock are covered by sbom.yml's grype scan.
      - name: Hex audit (retired packages)
        working-directory: manager
        run: mix hex.audit

      - name: Elixir format check
        working-directory: manager
        run: mix format --check-formatted

      - name: Elixir compile
        working-directory: manager
        run: mix compile --warnings-as-errors

      # The test env points every root at temp dirs itself (see
      # config/config.exs and Abyssal.Test.IsolatedRoots).
      - name: Elixir tests (including real mkdwarfs + FUSE mounts)
        working-directory: manager
        run: mix test --include requires_mkdwarfs --include requires_fuse

      - name: Build the CLI escript
        working-directory: manager
        run: mix escript.build

      # Polls the actual TCP port rather than grepping for a log line:
      # supervised children (ZfsMonitor.Cache, Datasets.Mounts) log before
      # GRPC.Server.Supervisor's listener is actually bound, so the demo
      # CLI could connect before the port was really up -- this is what
      # failed on the first real CI run (`demo failed: :no_addresses`).
      # /mnt/abyssal (the production default) isn't writable by the
      # runner user.
      - name: Start the manager
        working-directory: manager
        env:
          ABYSSAL_MOUNT_ROOT: ${{ runner.temp }}/abyssal/mnt
          ABYSSAL_DECRYPT_ROOT: ${{ runner.temp }}/abyssal/shm
        run: |
          nohup mix run --no-halt > /tmp/manager.log 2>&1 &
          echo $! > /tmp/manager.pid
          for _ in $(seq 1 30); do
            (exec 3<>/dev/tcp/127.0.0.1/50051) 2>/dev/null && exit 0
            sleep 1
          done
          echo "manager did not start in time" >&2
          cat /tmp/manager.log
          exit 1

      # The project's own acceptance gate: publish -> mount -> read-range ->
      # byte-compare, over real gRPC, through a real dwarfs FUSE mount. Once
      # unencrypted, once encrypted (raw key + phrase + Shamir shares all
      # independently verified) -- see manager/lib/abyssal/cli.ex.
      - name: End-to-end demo (plain + encrypted)
        working-directory: manager
        run: |
          ./abyssal demo
          ./abyssal demo --encrypt

      - name: Show manager log
        if: always()
        run: cat /tmp/manager.log || true

      # Killing the manager skips Mounts.terminate/2, so detach anything it
      # left mounted explicitly -- lazily, since a dangling mount is the
      # only thing that could make this fail.
      - name: Stop the manager and detach mounts
        if: always()
        run: |
          kill "$(cat /tmp/manager.pid)" 2>/dev/null || true
          awk -v root="$RUNNER_TEMP/abyssal/mnt/" '$3 == "fuse.dwarfs" && index($2, root) == 1 { print $2 }' /proc/self/mounts \
            | xargs -r -n1 fusermount3 -u -z || true
